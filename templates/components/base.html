<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <style>
    /* La sezione Ordini del borderò viene stampata su questa pagina orizzontale;
       tutto il resto del documento resta sulla pagina di default sotto. */
    @page landscape {
      size: A4 landscape;
      margin: 1cm;
    }

    @page {
      size: A4 portrait;
      margin: 1cm;
    }

    body {
      font-family: Helvetica, sans-serif;
      font-size: 13px;
      margin: 0;
      color: #333;
    }

    h1 { font-size: 20px; margin-bottom: 10px; }

    /* Carta intestata (components/company.html) */
    /* Niente margini laterali: xhtml2pdf li applica al contenuto delle celle
       ma non al bordo disegnato, e i 2px di scarto facevano partire il logo
       staccato dal bordo sinistro e sbordare oltre il filetto di destra. */
    .letterhead {
      width: 100%;
      border: 1px solid #ccc;
      border-collapse: collapse;
      margin: 0 0 14px 0;
    }

    .letterhead td {
      border: none;
      padding: 4px 7px;
      vertical-align: middle;
    }

    /* Il logo riempie la colonna di sinistra da bordo a bordo: niente
       padding, e l'altezza fissa dell'immagine detta l'altezza dell'intero
       rettangolo (il blocco dati e' sempre piu' basso). Il filetto grigio a
       destra lo separa dal resto dell'intestazione. */
    .letterhead td.letterhead-logo {
      width: 52px;
      padding: 0;
      border-right: 1px solid #ccc;
    }

    .letterhead-logo img { height: 52px; }

    .letterhead-info {
      font-size: 10px;
      color: #333;
      line-height: 1.2;
    }

    .letterhead td.letterhead-info { padding-left: 12px; }

    .letterhead-name {
      font-size: 14px;
      font-weight: bold;
      color: #000;
    }

    /* La targhetta e' un SVG alto quanto l'intestazione che disegna il
       riquadro grigio solo in fondo, cosi' si incastra nei bordi del
       rettangolo come se ne fosse un prolungamento. */
    .letterhead td.letterhead-powered { width: 96px; padding: 0; }

    .powered-tag { width: 96px; height: 52px; }

    /* xhtml2pdf fa collassare i margini verticali tenendo il piu' grande:
       lo stacco fra due sezioni lo detta ora il margine inferiore della
       .section (30px come prima), cosi' abbassare il margin-top dell'h2
       accorcia solo il vuoto sotto il titolo del documento, che una
       .section davanti non ce l'ha. */
    h2 {
      font-size: 16px;
      margin-top: 12px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }

    .section { margin-bottom: 30px; }

    .info-table,
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .info-table td,
    .data-table td,
    .data-table th {
      border: 1px solid #ccc;
      padding: 8px;
      vertical-align: top;
    }

    .info-table td.label {
      font-weight: bold;
      background: #f2f2f2;
      width: 30%;
    }

    .data-table th {
      background-color: #f0f0f0;
      font-weight: bold;
      text-align: left;
    }

    .data-table.card-index td,
    .data-table.card-index th {
      padding: 6px 5px;
      font-size: 12px;
    }

    /* I cognomi composti sono parole singole troppo lunghe per la cella e
       sborderebbero su Stato: qui si spezza a caratteri, non a parole. */
    .data-table.card-index td.wrap-anywhere {
      -pdf-word-wrap: CJK;
    }

    .flex-row {
      display: flex;
      gap: 20px;
      justify-content: space-between;
    }

    .half-section { flex: 1; }

    .half-section h2 {
      font-size: 15px;
      margin-top: 0;
      padding-bottom: 5px;
      border-bottom: 1px solid #ccc;
    }

    .total {
      text-align: right;
      font-size: 16px;
      margin-top: 40px;
    }

    /* RAE */
    .rae-h1 { font-size: 20px; margin-bottom: 8px; }

    .rae-h2 {
      font-size: 15px;
      margin-top: 10px;
      margin-bottom: -7px;
      padding-bottom: 0 !important;
    }

    .rae-info-table {
      width: 100%;
      border-collapse: collapse;
    }

    .rae-info-table td,
    .rae-data-table td,
    .rae-data-table th {
      border: 1px solid #ccc;
      padding: 2px;
      vertical-align: top;
    }

    .rae-info-table td.long-label {
      font-weight: bold;
      background: #f2f2f2;
      width: 55%;
    }

    .rae-info-table td.label {
      font-weight: bold;
      background: #f2f2f2;
      width: 30%;
    }

    .rae-info-table td.short-label {
      font-weight: bold;
      background: #f2f2f2;
      width: 20%;
    }

    .rae-data-table th {
      background-color: #f0f0f0;
      font-weight: bold;
      text-align: left;
    }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
