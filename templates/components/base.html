<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <style>
    /* La sezione Ordini del borderò viene stampata su questa pagina orizzontale;
       tutto il resto del documento resta sulla pagina di default sotto. */
    @page landscape {
      size: A4 landscape;
      margin: 1cm;
    }

    @page {
      size: A4 portrait;
      margin: 1cm;
    }

    body {
      font-family: Helvetica, sans-serif;
      font-size: 13px;
      margin: 0;
      color: #333;
    }

    h1 { font-size: 20px; margin-bottom: 10px; }

    /* Carta intestata (components/company.html) */
    /* Niente margini laterali: xhtml2pdf li applica al contenuto delle celle
       ma non al bordo disegnato, e i 2px di scarto facevano partire il logo
       staccato dal bordo sinistro e sbordare oltre il filetto di destra. */
    .letterhead {
      width: 100%;
      border: 1px solid #ccc;
      border-collapse: collapse;
      margin: 0 0 14px 0;
    }

    .letterhead td {
      border: none;
      padding: 4px 7px;
      vertical-align: middle;
    }

    /* Il logo e' un quadrato che riempie la sua colonna da bordo a bordo:
       52px e' il lato "storico" (bastava per una riga sola di ragione
       sociale), ma company_header (components/company.html) lo sovrascrive
       inline - su td E img, entrambe width E height - con
       letterhead_height_portrait/landscape, calcolata in
       exportation/utils.py replicando l'a capo reale del testo. Va sui due
       assi apposta: se il nome va a capo su piu' righe la riga cresce, e il
       logo deve restare un quadrato invece di diventare un rettangolo
       (altezza maggiore, larghezza ferma a 52px) - quindi e' la colonna
       stessa ad allargarsi con lui, non solo l'immagine dentro. Senza
       questo width sull'img, un'altezza diversa da quella naturale
       dell'immagine farebbe comunque ricalcolare la larghezza per
       mantenerne le proporzioni, sbordando dalla colonna. vertical-align:top
       resta come fallback per le chiamate dirette del macro senza altezza
       calcolata (es. i test): meglio attaccato in alto che centrato con
       vuoto sui due lati. Il filetto grigio a destra separa il logo dal
       resto dell'intestazione. */
    .letterhead td.letterhead-logo {
      width: 52px;
      padding: 0;
      border-right: 1px solid #ccc;
      vertical-align: top;
    }

    .letterhead-logo img { width: 52px; height: 52px; }

    .letterhead-info {
      font-size: 10px;
      color: #333;
      line-height: 1.2;
    }

    .letterhead td.letterhead-info { padding-left: 12px; }

    .letterhead-name {
      font-size: 14px;
      font-weight: bold;
      color: #000;
    }

    /* La targhetta e' un SVG (96x52, vedi exportation/powered_tag.svg) che
       disegna il riquadro grigio solo nella meta' inferiore del suo canvas,
       cosi' si incastra nei bordi del rettangolo come un prolungamento:
       scalarne solo l'altezza (width fissa, come sopra per il logo) lo
       stira ma tiene il fondo del riquadro sempre a contatto col bordo
       inferiore, qualunque sia l'altezza. 52px e' quella "storica"; come
       per il logo, company_header la sovrascrive inline con
       letterhead_height_portrait/landscape perche' combaci col blocco dati
       quando il nome va a capo. vertical-align:bottom e' il fallback per le
       chiamate senza altezza calcolata: il riquadro resta comunque
       incastrato in basso invece di fluttuare centrato. */
    .letterhead td.letterhead-powered { width: 96px; padding: 0; vertical-align: bottom; }

    .powered-tag { width: 96px; height: 52px; }

    /* xhtml2pdf fa collassare i margini verticali tenendo il piu' grande:
       lo stacco fra due sezioni lo detta ora il margine inferiore della
       .section (30px come prima), cosi' abbassare il margin-top dell'h2
       accorcia solo il vuoto sotto il titolo del documento, che una
       .section davanti non ce l'ha. */
    h2 {
      font-size: 16px;
      margin-top: 12px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }

    .section { margin-bottom: 30px; }

    .info-table,
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .info-table td,
    .data-table td,
    .data-table th {
      border: 1px solid #ccc;
      padding: 8px;
      vertical-align: top;
    }

    .info-table td.label {
      font-weight: bold;
      background: #f2f2f2;
      width: 30%;
    }

    .data-table th {
      background-color: #f0f0f0;
      font-weight: bold;
      text-align: left;
    }

    .data-table.card-index td,
    .data-table.card-index th {
      padding: 6px 5px;
      font-size: 12px;
    }

    /* Tabella "Ordini" delle pagine orizzontali del borderò: il cliente vuole
       fino a 5 ordini per pagina, con il blocco firma sotto ogni gruppo. Font
       e padding ridotti quel tanto che basta perché 5 righe + intestazione +
       firma stiano su una sola A4 landscape restando leggibili; le note lunghe
       e l'elenco prodotti li accorcia il template. */
    /* Tabella "Ordini" del borderò. Il corpo non è fisso: lo sceglie l'export,
       che prova i corpi candidati e tiene il maggiore che non aggiunge pagine
       (vedi exportation/schedule.py). Il default è il minimo della scala, così
       chi rende il template senza passare la variabile ottiene comunque una
       pagina che sta in piedi. */
    .data-table.bordero-orders td,
    .data-table.bordero-orders th {
      padding: 3px 5px 2px;
      font-size: {{ schedule_orders_font_size | default(10) }}px;
      line-height: 1.3;
    }

    /* I cognomi composti sono parole singole troppo lunghe per la cella e
       sborderebbero su Stato: qui si spezza a caratteri, non a parole. */
    .data-table.card-index td.wrap-anywhere {
      -pdf-word-wrap: CJK;
    }

    .flex-row {
      display: flex;
      gap: 20px;
      justify-content: space-between;
    }

    .half-section { flex: 1; }

    .half-section h2 {
      font-size: 15px;
      margin-top: 0;
      padding-bottom: 5px;
      border-bottom: 1px solid #ccc;
    }

    .total {
      text-align: right;
      font-size: 16px;
      margin-top: 40px;
    }

    /* RAE */
    .rae-h1 { font-size: 20px; margin-bottom: 8px; }

    /* margin-top e' stato ridotto insieme a quello di .rae-section qui sotto
       (12-Set-2026): sono gli stessi 12px a dettare lo stacco fra due
       sezioni via margin-collapse (il piu' grande dei due vince, non la
       somma - vedi il commento su .section/h2 piu' in basso), quindi vanno
       tagliati insieme o il secondo non si vede finche' non scende sotto
       il primo. */
    .rae-h2 {
      font-size: 15px;
      margin-top: 6px;
      margin-bottom: -7px;
      padding-bottom: 0 !important;
    }

    /* Il DDT RAEE ha 7 sezioni in una pagina sola: la .section generica (30px,
       pensata per documenti piu' corti) le farebbe sborare su una seconda
       pagina quasi vuota. Stesso ruolo, margine ridotto solo qui.
       Sceso ulteriormente da 12 a 8px (12-Set-2026) insieme al margin-top
       di .rae-h2 qui sopra: con una ragione sociale lunghissima la carta
       intestata (components/company.html) cresce e il margine compensativo
       che le sta sotto non recupera comunque abbastanza spazio da solo -
       verificato rigenerando il documento vero, sfora ancora sulla seconda
       pagina solo per la tabella firme finale. */
    .rae-section { margin-bottom: 8px; }

    .rae-info-table {
      width: 100%;
      border-collapse: collapse;
    }

    /* padding sceso da 2 a 1px (12-Set-2026), insieme ai margini di
       .rae-section/.rae-h2 qui sopra: 21 righe di celle sul DDT RAEE,
       0.75pt recuperati per lato fanno la differenza fra 1 e 2 pagine
       quando la ragione sociale e' lunghissima (vedi .rae-section). */
    .rae-info-table td,
    .rae-data-table td,
    .rae-data-table th {
      border: 1px solid #ccc;
      padding: 1px;
      vertical-align: top;
    }

    .rae-info-table td.long-label {
      font-weight: bold;
      background: #f2f2f2;
      width: 55%;
    }

    .rae-info-table td.label {
      font-weight: bold;
      background: #f2f2f2;
      width: 30%;
    }

    .rae-info-table td.short-label {
      font-weight: bold;
      background: #f2f2f2;
      width: 20%;
    }

    .rae-data-table th {
      background-color: #f0f0f0;
      font-weight: bold;
      text-align: left;
    }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
