<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: Helvetica, sans-serif;
      font-size: 13px;
      margin: 0;
      color: #333;
    }

    h1 { font-size: 20px; margin-bottom: 10px; }

    /* Carta intestata (components/company.html) */
    .letterhead {
      width: 100%;
      border: 1px solid #ccc;
      border-collapse: collapse;
      margin: 2px 2px 14px 2px;
    }

    .letterhead td {
      border: none;
      padding: 4px 7px;
      vertical-align: middle;
    }

    .letterhead-logo { width: 66px; }
    .letterhead td.letterhead-logo { padding-right: 3px; }
    .letterhead-logo img { width: 38px; height: 38px; }

    .letterhead-info {
      font-size: 10px;
      color: #333;
      line-height: 1.2;
    }

    .letterhead td.letterhead-info { padding-left: 4px; }

    .letterhead-name {
      font-size: 14px;
      font-weight: bold;
      color: #000;
    }

    .letterhead-powered { width: 118px; text-align: right; }

    .powered-tag {
      font-size: 8px;
      line-height: 1.2;
      color: #000;
      text-align: center;
    }

    h2 {
      font-size: 16px;
      margin-top: 30px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }

    .section { margin-bottom: 20px; }

    .info-table,
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .info-table td,
    .data-table td,
    .data-table th {
      border: 1px solid #ccc;
      padding: 8px;
      vertical-align: top;
    }

    .info-table td.label {
      font-weight: bold;
      background: #f2f2f2;
      width: 30%;
    }

    .data-table th {
      background-color: #f0f0f0;
      font-weight: bold;
      text-align: left;
    }

    .data-table.card-index td,
    .data-table.card-index th {
      padding: 6px 5px;
      font-size: 12px;
    }

    /* I cognomi composti sono parole singole troppo lunghe per la cella e
       sborderebbero su Stato: qui si spezza a caratteri, non a parole. */
    .data-table.card-index td.wrap-anywhere {
      -pdf-word-wrap: CJK;
    }

    .flex-row {
      display: flex;
      gap: 20px;
      justify-content: space-between;
    }

    .half-section { flex: 1; }

    .half-section h2 {
      font-size: 15px;
      margin-top: 0;
      padding-bottom: 5px;
      border-bottom: 1px solid #ccc;
    }

    .total {
      text-align: right;
      font-size: 16px;
      margin-top: 40px;
    }

    /* RAE */
    .rae-h1 { font-size: 20px; margin-bottom: 8px; }

    .rae-h2 {
      font-size: 15px;
      margin-top: 10px;
      margin-bottom: -7px;
      padding-bottom: 0 !important;
    }

    .rae-info-table {
      width: 100%;
      border-collapse: collapse;
    }

    .rae-info-table td,
    .rae-data-table td,
    .rae-data-table th {
      border: 1px solid #ccc;
      padding: 2px;
      vertical-align: top;
    }

    .rae-info-table td.long-label {
      font-weight: bold;
      background: #f2f2f2;
      width: 55%;
    }

    .rae-info-table td.label {
      font-weight: bold;
      background: #f2f2f2;
      width: 30%;
    }

    .rae-info-table td.short-label {
      font-weight: bold;
      background: #f2f2f2;
      width: 20%;
    }

    .rae-data-table th {
      background-color: #f0f0f0;
      font-weight: bold;
      text-align: left;
    }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
