[project]
name = "italco-be"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "generic_lib[unix] @ git+https://github.com/hosting232323/generic-lib.git ; sys_platform != 'win32'",
  "generic_lib[win] @ git+https://github.com/hosting232323/generic-lib.git ; sys_platform == 'win32'",
  "xhtml2pdf",
  "pandas",
  "openpyxl",
  "hashids",
  "openai",
  "python-telegram-bot",
  "gunicorn",
  "geopy",
  "scipy",
  "pdfplumber",
  "camelot-py[cv]",
  "xlrd",
  "flask-cors",
]

[project.optional-dependencies]
dev = [
  "tqdm",
  "pytest",
  "coverage",
  "python-dotenv",
  "ruff",
  "playwright",
  "pytest-playwright",
]

[tool.ruff]
line-length = 120
indent-width = 2

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "T"]
ignore = ["COM812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  # Test end-to-end con Playwright contro frontend + backend reali: servono
  # i servizi attivi e non entrano nella misura di coverage.
  # Suite veloce con: pytest -m "not e2e"
  "e2e: end-to-end test con Playwright (deseleziona con '-m \"not e2e\"')",
]

[tool.coverage.run]
source = ["src"]
omit = [
  "src/__main__.py",
  "src/database/alembic/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "def __repr__",
]
