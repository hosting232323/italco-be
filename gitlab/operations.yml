.setup_database:
  stage: operations
  when: manual
  needs: []
  allow_failure: true
  tags:
    - "${SERVER_NAME}-deploy"
  script:
    - export DB_URL="$DATABASE_URL_PIPELINE"
    - export DB_NAME=$(echo "$DB_URL" | awk -F/ '{print $NF}')
    - export BASE_URL="${DB_URL%/*}/postgres"

    - |
      EXISTS=$(psql "$BASE_URL" -tAc "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}'")
      if [ "$EXISTS" = "1" ]; then
        echo "❌ Database '$DB_NAME' already exists. Failing job."
        exit 1
      fi

    - echo "Database does not exist. Creating..."
    - psql "$BASE_URL" -c "CREATE DATABASE ${DB_NAME};"
    - echo "✅ Database '$DB_NAME' created successfully."

setup_database_test:
  extends: .setup_database
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
  variables:
    DATABASE_URL_PIPELINE: "${DATABASE_URL}_test"

setup_database_prod:
  extends: .setup_database
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    DATABASE_URL_PIPELINE: "${DATABASE_URL}"

.restore_backup:
  stage: operations
  when: manual
  needs: []
  allow_failure: false
  tags:
    - "${SERVER_NAME}-deploy"
  variables:
    API_PREFIX: api
  script:
    - |
      set -eu

      export DB_URL="$DATABASE_URL_PIPELINE"
      export DB_NAME=$(echo "$DB_URL" | awk -F/ '{print $NF}' | cut -d'?' -f1)
      export BASE_URL="${DB_URL%/*}/postgres"

      if docker ps -q -f "name=^/${SERVICE}-blue$" | grep -q .; then
        ACTIVE=blue
      elif docker ps -q -f "name=^/${SERVICE}-green$" | grep -q .; then
        ACTIVE=green
      else
        echo "❌ Nessun container attivo per ${SERVICE}: restore annullato."
        exit 1
      fi
      CONTAINER="${SERVICE}-${ACTIVE}"

      # I dump stanno nel repository restic cifrato <BACKUP_FOLDER>/db-backup
      # (generic-lib): li estrae il container, che ha restic, RESTIC_PASSWORD e la
      # chiave ssh della macchina di backup. Va fatto prima di fermarlo.
      # BACKUP_SNAPSHOT (variabile del job manuale) sceglie uno snapshot preciso.
      SNAPSHOT="${BACKUP_SNAPSHOT:-latest}"
      LOCAL_DUMP="/tmp/restore_$(date +%s).dump"
      trap 'rm -f "$LOCAL_DUMP"' EXIT
      echo "📦 Estrazione dello snapshot ${SNAPSHOT} da ${CONTAINER}..."
      docker exec "${CONTAINER}" db_fetch_backup "$LOCAL_DUMP" "$SNAPSHOT"
      docker cp "${CONTAINER}:${LOCAL_DUMP}" "$LOCAL_DUMP"
      docker exec "${CONTAINER}" rm -f "$LOCAL_DUMP"
      if [ ! -s "$LOCAL_DUMP" ]; then
        echo "❌ Dump vuoto o mancante: restore annullato."
        exit 1
      fi
      echo "✅ Dump estratto in $LOCAL_DUMP"

      echo "⏹ Stopping ${CONTAINER}..."
      docker stop "${CONTAINER}"

      psql "$BASE_URL" -c \
        "SELECT pg_terminate_backend(pid)
         FROM pg_stat_activity
         WHERE datname = '${DB_NAME}' AND pid <> pg_backend_pid();"
      psql "$BASE_URL" -c "DROP DATABASE IF EXISTS ${DB_NAME};"
      psql "$BASE_URL" -c "CREATE DATABASE ${DB_NAME};"
      echo "✅ Database '$DB_NAME' ricreato."

      pg_restore \
        --no-owner \
        --no-acl \
        --exit-on-error \
        -d "$DB_URL" \
        "$LOCAL_DUMP" || { docker start "${CONTAINER}"; exit 1; }
      echo "✅ Dump importato."
      rm -f "$LOCAL_DUMP"

      echo "🚀 Avvio ${CONTAINER}..."
      docker start "${CONTAINER}"

      READY=0
      for _ in $(seq 1 15); do
        if docker exec "${CONTAINER}" curl -fsS "http://localhost:8080/${API_PREFIX}/" >/dev/null 2>&1; then
          READY=1; break
        fi
        sleep 2
      done
      if [ "${READY}" = "1" ]; then
        echo "✅ Applicazione online."
      else
        echo "❌ Applicazione offline."
        docker logs "${CONTAINER}" --tail 50 || true
        exit 1
      fi

restore_backup_test:
  extends: .restore_backup
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
  variables:
    SERVICE: "${PROJECT_NAME}-test"
    DATABASE_URL_PIPELINE: "${DATABASE_URL}_test"

restore_backup_prod:
  extends: .restore_backup
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    SERVICE: "$PROJECT_NAME"
    DATABASE_URL_PIPELINE: "$DATABASE_URL"
